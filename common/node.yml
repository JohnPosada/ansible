- name: "Install fnm with node version"
  block:
  - name: "Download fnm installation script"
    get_url:
      url: https://fnm.vercel.app/install
      dest: /tmp/fnm_install.sh
      mode: "0755"

  - name: "Execute fnm installation script"
    shell: |
      /tmp/fnm_install.sh --skip-shell
      $HOME/.local/share/fnm/fnm install --lts
      $HOME/.local/share/fnm/fnm default lts-latest
    args:
      executable: /bin/bash
  tags:
    - node
    - install

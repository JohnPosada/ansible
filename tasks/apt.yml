- name: install apt packages
  block:
  - name: "Install system packages"
    become: true
    apt:
      name:
        [
          "unzip",
          "tree",
          "fd-find",
          "curl",
          "ripgrep",
          "copyq",
          "xclip",
          "wl-clipboard",
          "direnv",
          "feh",
          "stow",
          "rsync",
          "flameshot",
          "apt-show-versions",
          "git-extras",
          "bat",
          "tmux",
          "cpu-checker",
          "btop",
          "git-filter-repo",
          "gimp",
          "python3-pip",
        ]
      state: present

  - name: "Link Ubuntu renamed binaries (fdfind -> fd, batcat -> bat)"
    file:
      src: "/usr/bin/{{ item.src }}"
      dest: "{{ bin }}/{{ item.dest }}"
      state: link
    loop:
      - { src: fdfind, dest: fd }
      - { src: batcat, dest: bat }

  tags:
    - apt
    - install

- name: "Install GitHub CLI"
  block:
  - name: "Create directory for keyrings"
    become: true
    file:
      path: /etc/apt/keyrings
      state: directory
      mode: "0755"

  - name: "Download GitHub CLI GPG key"
    become: true
    get_url:
      url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
      dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
      mode: "0644"

  - name: "Add GitHub CLI repository"
    become: true
    deb822_repository:
      name: github-cli
      types: deb
      uris: https://cli.github.com/packages
      suites: stable
      components: main
      architectures: "{{ deb_architecture[ansible_architecture] }}"
      signed_by: /etc/apt/keyrings/githubcli-archive-keyring.gpg

  - name: "Install gh"
    become: true
    apt:
      name: gh
      state: present
      update_cache: true

  tags:
    - gh
    - git
    - dotfiles
    - install

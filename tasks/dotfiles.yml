- name: "Setup dotfiles using Stow"
  block:
    - name: "Ensure Stow is installed"
      become: true
      apt:
        name: stow
        state: present

    - name: "Check if dotfiles are already cloned"
      stat:
        path: "{{ dotfiles_dir }}/.git"
      register: dotfiles_repo

    - name: "Check GitHub login (dotfiles repo is private)"
      command: gh auth token --hostname github.com --user {{ dotfiles_github_user }}
      register: gh_login
      failed_when: false
      changed_when: false
      no_log: true
      when: not dotfiles_repo.stat.exists

    - name: "Stop if not logged in to GitHub"
      fail:
        msg: |
          The dotfiles repo is private and gh has no session for {{ dotfiles_github_user }}.
          Run this, then run the playbook again:
            gh auth login --hostname github.com --git-protocol https --web
      when: not dotfiles_repo.stat.exists and gh_login.rc != 0

    - name: "Clone dotfiles repository"
      git:
        repo: "https://{{ dotfiles_github_user }}@github.com/JohnPosada/dotfiles.git"
        dest: "{{ dotfiles_dir }}"
        update: false
      environment:
        GIT_TERMINAL_PROMPT: "0"
        GIT_CONFIG_COUNT: "2"
        GIT_CONFIG_KEY_0: credential.https://github.com.helper
        GIT_CONFIG_VALUE_0: ""
        GIT_CONFIG_KEY_1: credential.https://github.com.helper
        GIT_CONFIG_VALUE_1: "!gh auth git-credential"
      when: not dotfiles_repo.stat.exists

    - name: "Backup files that would conflict with stow"
      shell: |
        cd "{{ dotfiles_dir }}/{{ item }}"
        find . \( -type f -o -type l \) | while read -r f; do
          rel="${f#./}"
          target="{{ home }}/$rel"
          if [ -e "$target" ] || [ -L "$target" ]; then
            case "$(readlink -f "$target")" in "{{ dotfiles_dir }}/"*) continue ;; esac
            mkdir -p "{{ dotfiles_backup }}/$(dirname "$rel")"
            mv "$target" "{{ dotfiles_backup }}/$rel"
            echo "backed up $target"
          fi
        done
      args:
        executable: /bin/bash
      loop: "{{ dotfiles }}"
      register: dotfiles_backup_result
      changed_when: dotfiles_backup_result.stdout != ""

    # systemd: link the unit files, not the directory, so systemctl enable
    # doesn't write its symlinks into the repo
    - name: "execute Stow to create symlinks"
      shell: |
        stow {{ '--no-folding' if item == 'systemd' else '' }} {{ item }}
      args:
        chdir: "{{ dotfiles_dir }}"
        executable: /bin/bash
      loop: "{{ dotfiles }}"

    # daily `dots sync`; needs a systemd user session (not there in containers)
    - name: "Check for a systemd user session"
      stat:
        path: "/run/user/{{ ansible_user_uid }}/bus"
      register: user_bus

    - name: "Enable dots sync timer"
      systemd_service:
        name: dots-sync.timer
        scope: user
        enabled: true
        state: started
        daemon_reload: true
      when: user_bus.stat.exists

    - name: "dots sync timer not enabled"
      debug:
        msg: "No systemd user session: after logging in run systemctl --user enable --now dots-sync.timer"
      when: not user_bus.stat.exists

  vars:
    dotfiles_dir: "{{ home }}/dotfiles"
    dotfiles_github_user: "{{ git_profiles[git_default_profile].github_user }}"
    dotfiles_backup: "{{ home }}/.dotfiles-backup/{{ ansible_date_time.iso8601_basic_short }}"
    dotfiles:
      - gitconfig
      - zsh
      - nvim
      - autostart
      - bash
      - kitty
      - atuin
      - bin
      - systemd

  tags:
    - dotfiles
    - terminal
    - install
